[workspace]
resolver = "2"
members = ["crates/emthin", "crates/emthin-clipboard", "crates/emthin-dbus"]
# Guard against rust-analyzer's scratch target directory (which it may create
# under crates/target/rust-analyzer/) being picked up as a workspace member.
exclude = ["crates/target"]

[workspace.package]
version = "0.3.12"
edition = "2021"
authors = ["Lee <loyalpartner@163.com>"]
license = "GPL-3.0"
repository = "https://github.com/emthin/emthin"

[workspace.dependencies]
# Pinned by rev (not branch): the `emskin-patches` branch lived on a fork
# (ningxilai/smithay) that has since been deleted; that commit was pushed
# upstream to Smithay/smithay, so pin the exact same SHA there. Content is
# byte-identical — same commit object, only the hosting URL changed.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "2eb24b31785bb873a9f3808e0a57048d8adaef6a", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "wayland_frontend",
    "desktop",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
