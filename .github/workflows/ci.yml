# A14: emthin's own CI.
#
# Before this file existed, the only CI touch of this workspace was
# `cargo check -p emthin` in unfer's cross-repo job — a check that (a) covered
# one of three crates and (b) ran from *outside* this repo, so a red verdict
# appeared under unfer's name. The tests AGENTS.md documents (`xwayland_*`,
# `docui`, `figure_render`, `keymap`, `session`, figure binding) never ran in
# CI at all. This workflow is the repo's own gate: fmt plus the full test
# surface, including the two smithay-free sibling crates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      # The path-dependency closure runs deeper than this repo alone, and
      # every hop is a *path* dep that cargo resolves before it can build:
      #   emthin → velysterm/mathed_core, mathed_mini   (../../../velysterm)
      #   mathed_mini → unfer_protocol, unfer_ffi       (../../../unfer)
      #   unfer_consensus → arctic                      (../../dynamic-arctic)
      # (unfer's own CI clones this same set for its cross-repo job; the
      # layout is load-bearing: siblings must land in $GITHUB_WORKSPACE/..
      # so the relative paths resolve.)
      - name: checkout sibling repos (path deps)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/unfer.git ../unfer
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      # System dependencies, as documented in `docs/build-notes.md` and the
      # same set unfer's CI installs for this workspace:
      #   * glib/udev/input/seat/gbm/drm/egl — pkg-config lookups at
      #     build-script time (emthin-dbus -> gio, calloop -> udev,
      #     smithay's renderer),
      #   * xkbcommon/wayland/X11/xcb — link-time for smithay's wayland
      #     frontend and winit.
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libglib2.0-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            wayland-protocols libexpat1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-render0-dev

      # The toolchain comes from this repo's `rust-toolchain.toml` (channel +
      # rustfmt/clippy components) — rustup activates it per-checkout, so the
      # gate runs the version the repo pins rather than whatever is ambient.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2

      # Deliberately NOT `--all`: this cargo-fmt walks the whole path-dep
      # closure, so `--all` would format-check the sibling repos too (and a
      # formatting drift in velysterm/unfer would turn *this* repo's gate red).
      # Without `--all`, the virtual manifest covers exactly the three
      # workspace members — verified locally with a probe diff in
      # crates/emthin-dbus.
      - name: rustfmt
        run: cargo fmt --check

      # All three workspace crates, not just the compositor: the plan A14
      # acceptance is "`cargo test -p emthin` plus the clipboard/dbus crate
      # tests". `--locked` keeps CI on the committed Cargo.lock.
      #
      # F2 (round 3): tee the run and hand the log to the canonical status
      # gate in the unfer sibling (already cloned above as a path dep), so
      # the block's 347 is recounted from the run CI performs — a stale
      # count here becomes a red build instead of a silent claim. pipefail
      # matters: without it a failing suite would exit 0 through tee, and a
      # failed suite stops before the recount — a broken run cannot evidence
      # a count. If this goes green-but-wrong the other way (environment
      # scoping the count differently than nix develop), scope the block —
      # do not delete the gate.
      - name: test
        run: |
          set -o pipefail
          # On failure the log's tail is mirrored into ::error annotations —
          # the REST API returns those without log access, which is how the
          # 10-16 CI-only failures were diagnosed.
          cargo test --locked --workspace 2>&1 | tee /tmp/emthin_tests.log || {
            tail -25 /tmp/emthin_tests.log | sed 's/^/::error::test: /'
            exit 1
          }
          bash ../unfer/scripts/check-status --recount emthin=/tmp/emthin_tests.log

  # emthin-pad: the Android frontend. It is its own workspace (empty
  # `[workspace]` table), so the workspace `cargo test` above never touches
  # it — without this job its tests ran nowhere at all, which round 4 found
  # and round 5 closed. Host-only by design: the engine half is
  # target-independent, so these run with no NDK, no emulator and no
  # waydroid (AGENTS.md "#emthin-android"). Building the *APK* stays an
  # owner-run lane: `build-apk.sh` hard-pins four Nix store paths that a
  # flake update moves.
  android:
    name: emthin-pad host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      # Same path-dep closure as `test`: emthin-pad → velysterm
      # (mathed_core, mathed_mini) → unfer (decide_core, pulled in by
      # mathed_core). dynamic-arctic is not needed: mathed_mini's `kernel`
      # feature is off here, which drops unfer_consensus.
      - name: checkout sibling repos (path deps)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/unfer.git ../unfer

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2
        with:
          workspaces: emthin-android

      # `cd` rather than `--manifest-path`, so rustup picks up
      # emthin-android's own rust-toolchain.toml instead of the root one.
      - name: test
        run: |
          set -o pipefail
          cd emthin-android
          cargo test --locked 2>&1 | tee /tmp/emthin_pad_tests.log || {
            tail -25 /tmp/emthin_pad_tests.log | sed 's/^/::error::android: /'
            exit 1
          }

  # The §6 step-7 E2E — the only gate that exercises the real session:
  # keystrokes through XTEST, the clipboard proxy both ways, list_state on
  # the control socket, and graceful SIGTERM shutdown. Until 2026-10-15 this
  # ran only by hand, and a stale-state regression (10-13 green → 10-15
  # red across identical code) went unnoticed for two days; the harness was
  # hardened against carried state and now runs on every push.
  #
  # Everything graphical comes from the flake's devshell (Xvfb, sway,
  # xdotool, wl-clipboard), so the job installs nix and builds inside
  # `nix develop` — the repo's documented build environment — rather than
  # duplicating the apt system-deps step above. The xdotool config is forced
  # because it is the configuration the harness is verified against: ydotool
  # needs /dev/uinput privileges runners do not grant, and the headless
  # Mutter config is for machines with a free logind session.
  e2e:
    name: step-7 E2E (xdotool · sway · Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      # Same layout as the test job — the path-dep closure is load-bearing
      # and shared between the two jobs.
      - name: checkout sibling repos (path deps)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/unfer.git ../unfer
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      # Flakes on a stock runner: enable the experimental features and put
      # nix on PATH. cache.nixos.org is public, so the devshell's binary
      # cache hits without credentials.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # DeterminateSystems/nix-installer-action@v23

      # Build inside the devshell so the E2E runs against the flake's own
      # toolchain and library paths (the same environment scripts/e2e/README
      # documents for a hand run). run.sh would build on demand, but doing it
      # here keeps the build's exit status attributable to this step.
      - name: build emthin (nix devshell, locked)
        run: |
          set -o pipefail
          # Same annotation mirror as the test job: the failure's tail is
          # readable through the public annotations API without log access.
          nix develop -c cargo build --locked -p emthin 2>&1 | tee /tmp/e2e_build.log || {
            tail -8 /tmp/e2e_build.log | sed 's/^/::error::build: /'
            exit 1
          }

      # The tier-1 replay lane (§9): headless observe → apply → assert
      # against the document engine — a different lane from the E2E
      # below (filesystem boundary, no compositor; see
      # scripts/testing-depths.md), cheap enough to run first so a
      # document-engine regression fails before the session lane.
      # replay.sh re-enters velysterm's devshell itself (preview.sh
      # owns the mathed_mini build), so this step needs no wrapper.
      - name: run the tier-1 replay scenario
        run: ./scripts/agent/replay.sh scripts/agent/scenarios/figure-resize.txt

      # The nixpkgs sway wrapper falls back to `dbus-run-session` when the
      # job has no session bus (no DBUS_SESSION_BUS_ADDRESS, and no
      # $XDG_RUNTIME_DIR/bus on this image), and its dbus-daemon opens
      # /etc/dbus-1/session.conf — present on NixOS, where the harness was
      # written, absent here: the daemon dies with "EOF reading address from
      # bus daemon", the wrapper never execs sway, and the harness reports
      # "sway created no wayland socket" with a two-line sway.log (bbb2097).
      # Give the image the file the wrapper expects, taken from the flake's
      # own dbus so config and daemon cannot drift apart — minus its
      # <include> of that very path, which reads fine from share/ but is a
      # self-inclusion once the file *is* /etc/dbus-1/session.conf
      # ("Circular inclusion of file", reproduced in a mount namespace with
      # an empty /etc/dbus-1; the stripped copy then answers ListNames).
      - name: provide the session-bus config sway's wrapper reads
        run: |
          # shellcheck disable=SC2016
          # The $(...) below must expand inside the devshell, where
          # dbus-daemon is on PATH — not in the outer shell.
          if [ ! -e /etc/dbus-1/session.conf ]; then
            nix develop -c bash -c 'conf="$(dirname "$(readlink -f "$(command -v dbus-daemon)")")/../share/dbus-1/session.conf"; test -f "$conf" && cp "$conf" /tmp/e2e-session.conf'
            sed -i '/<include ignore_missing="yes">\/etc\/dbus-1\/session.conf<\/include>/d' /tmp/e2e-session.conf
            sudo mkdir -p /etc/dbus-1
            sudo install -m 644 /tmp/e2e-session.conf /etc/dbus-1/session.conf
          fi
          grep -c "<listen" /etc/dbus-1/session.conf
          ls -la /etc/dbus-1/session.conf

      - name: run the step-7 E2E
        run: |
          # File redirection, NOT a pipe: run.sh leaves the session's
          # daemons holding its stdout, and piping to tee made the step wait
          # on those inherited write-ends forever (the 45-min timeout, no
          # output — observed 2026-10-16 on 637257e). `timeout` bounds the
          # step itself, and the failing tail is re-emitted as ::error
          # annotations, the one channel the API returns without log access.
          # `|| rc=$?`, not `rc=$?` after: the runner's shell is `bash -e`,
          # which aborts at the failing command itself and would skip the
          # mirror (observed 2026-10-16 on 887f5cc).
          rc=0
          timeout --kill-after=30 600 nix develop -c ./scripts/e2e/run.sh --config xdotool > /tmp/e2e_run.log 2>&1 || rc=$?
          cp .e2e/xvfb.log /tmp/e2e_xvfb.log 2>/dev/null || true
          tail -60 /tmp/e2e_run.log
          if [ $rc -ne 0 ]; then
            # ONE annotation per file: the API keeps only the first ~10
            # annotations, so per-line emission silently drops the tail —
            # where the actual failure lives (observed on 7603d3e). %0A
            # makes a multi-line payload out of a single workflow command.
            body=$(tail -30 /tmp/e2e_run.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')
            echo "::error::e2e rc=$rc | $body"
            if [ -f /tmp/e2e_xvfb.log ]; then
              xv=$(tail -8 /tmp/e2e_xvfb.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')
              echo "::error::xvfb.log | $xv"
            fi
            # The compositor's own log: the harness names it on failure
            # ("see sway.log") and it holds the actual reason.
            cp .e2e/sway.log /tmp/e2e_sway.log 2>/dev/null || true
            if [ -f /tmp/e2e_sway.log ]; then
              sw=$(tail -14 /tmp/e2e_sway.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n')
              echo "::error::sway.log | $sw"
            fi
            exit $rc
          fi

      # On failure the harness logs (xvfb/sway/gnome-shell/session) are the
      # diagnosis — same files scripts/e2e/README tells a human to send.
      - name: upload E2E logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs
          path: .e2e/
          if-no-files-found: ignore
          retention-days: 14
