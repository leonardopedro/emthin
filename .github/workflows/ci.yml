# A14: emthin's own CI.
#
# Before this file existed, the only CI touch of this workspace was
# `cargo check -p emthin` in unfer's cross-repo job — a check that (a) covered
# one of three crates and (b) ran from *outside* this repo, so a red verdict
# appeared under unfer's name. The tests AGENTS.md documents (`xwayland_*`,
# `docui`, `figure_render`, `keymap`, `session`, figure binding) never ran in
# CI at all. This workflow is the repo's own gate: fmt plus the full test
# surface, including the two smithay-free sibling crates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      # The path-dependency closure runs deeper than this repo alone, and
      # every hop is a *path* dep that cargo resolves before it can build:
      #   emthin → velysterm/mathed_core, mathed_mini   (../../../velysterm)
      #   mathed_mini → unfer_protocol, unfer_ffi       (../../../unfer)
      #   unfer_consensus → arctic                      (../../dynamic-arctic)
      # (unfer's own CI clones this same set for its cross-repo job; the
      # layout is load-bearing: siblings must land in $GITHUB_WORKSPACE/..
      # so the relative paths resolve.)
      - name: checkout sibling repos (path deps)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/unfer.git ../unfer
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      # System dependencies, as documented in `docs/build-notes.md` and the
      # same set unfer's CI installs for this workspace:
      #   * glib/udev/input/seat/gbm/drm/egl — pkg-config lookups at
      #     build-script time (emthin-dbus -> gio, calloop -> udev,
      #     smithay's renderer),
      #   * xkbcommon/wayland/X11/xcb — link-time for smithay's wayland
      #     frontend and winit.
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libglib2.0-dev libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            wayland-protocols libexpat1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-render0-dev

      # The toolchain comes from this repo's `rust-toolchain.toml` (channel +
      # rustfmt/clippy components) — rustup activates it per-checkout, so the
      # gate runs the version the repo pins rather than whatever is ambient.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # Swatinem/rust-cache@v2

      # Deliberately NOT `--all`: this cargo-fmt walks the whole path-dep
      # closure, so `--all` would format-check the sibling repos too (and a
      # formatting drift in velysterm/unfer would turn *this* repo's gate red).
      # Without `--all`, the virtual manifest covers exactly the three
      # workspace members — verified locally with a probe diff in
      # crates/emthin-dbus.
      - name: rustfmt
        run: cargo fmt --check

      # All three workspace crates, not just the compositor: the plan A14
      # acceptance is "`cargo test -p emthin` plus the clipboard/dbus crate
      # tests". `--locked` keeps CI on the committed Cargo.lock.
      - name: test
        run: cargo test --locked --workspace

  # The §6 step-7 E2E — the only gate that exercises the real session:
  # keystrokes through XTEST, the clipboard proxy both ways, list_state on
  # the control socket, and graceful SIGTERM shutdown. Until 2026-10-15 this
  # ran only by hand, and a stale-state regression (10-13 green → 10-15
  # red across identical code) went unnoticed for two days; the harness was
  # hardened against carried state and now runs on every push.
  #
  # Everything graphical comes from the flake's devshell (Xvfb, sway,
  # xdotool, wl-clipboard), so the job installs nix and builds inside
  # `nix develop` — the repo's documented build environment — rather than
  # duplicating the apt system-deps step above. The xdotool config is forced
  # because it is the configuration the harness is verified against: ydotool
  # needs /dev/uinput privileges runners do not grant, and the headless
  # Mutter config is for machines with a free logind session.
  e2e:
    name: step-7 E2E (xdotool · sway · Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      # Same layout as the test job — the path-dep closure is load-bearing
      # and shared between the two jobs.
      - name: checkout sibling repos (path deps)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/velysterm.git ../velysterm
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/unfer.git ../unfer
          git clone --depth 1 --branch main \
            https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      # Flakes on a stock runner: enable the experimental features and put
      # nix on PATH. cache.nixos.org is public, so the devshell's binary
      # cache hits without credentials.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # DeterminateSystems/nix-installer-action@v23

      # Build inside the devshell so the E2E runs against the flake's own
      # toolchain and library paths (the same environment scripts/e2e/README
      # documents for a hand run). run.sh would build on demand, but doing it
      # here keeps the build's exit status attributable to this step.
      - name: build emthin (nix devshell, locked)
        run: nix develop -c cargo build --locked -p emthin

      - name: run the step-7 E2E
        run: nix develop -c ./scripts/e2e/run.sh --config xdotool

      # On failure the harness logs (xvfb/sway/gnome-shell/session) are the
      # diagnosis — same files scripts/e2e/README tells a human to send.
      - name: upload E2E logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs
          path: .e2e/
          if-no-files-found: ignore
          retention-days: 14
