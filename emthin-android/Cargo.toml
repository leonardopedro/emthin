[package]
name = "emthin-pad"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "emthin pad — Android app embedding emthin's DocModel verbatim"
publish = false

[lib]
crate-type = ["cdylib"]

# Standalone workspace: the crate lives inside the emthin checkout but
# must not join the emthin workspace (it path-depends on velysterm and
# builds its own release artifacts).
[workspace]

# `libemthin_pad.so` — loaded via System.loadLibrary("emthin_pad").

[dependencies]
jni = "0.22"
serde_json = "1"
mathed_core = { path = "../../velysterm/crates/mathed_core" }
# The document renderer (Typst paged layout -> CPU raster). `default-features
# = false` drops `gui` (winit/softbuffer) and `kernel` (the unfer kernel's
# dependency tree does not build for Android) — the same choice
# `velysterm/crates/mathed_android` makes. `render` itself is NOT feature
# gated, so `render_doc` is available here.
mathed_mini = { path = "../../velysterm/crates/mathed_mini", default-features = false }
# base64 carries a raster across the JNI string boundary in one value,
# matching mathed_android's screenshot transport.
base64 = "0.22"
unicode-segmentation = "1"

# Tests only: the preview's pageView canvas must equal mathed_android's
# engine `BG` (the paint its frames sit on), so the pin test compares
# the Java colour literal against the real constant rather than a copy.
[dev-dependencies]
mathed_android = { path = "../../velysterm/crates/mathed_android" }

[profile.release]
# Keep .dynsym (JNI resolves Java_* by dlsym), drop only debug info —
# typst's debug info dwarfs the rest of the .so.
strip = "debuginfo"
